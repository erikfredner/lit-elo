{% comment %}Rank movement since the MLAIB starting rank. Expects `change` (int or None).{% endcomment %}{% if change is None %}<span class="muted">&ndash;</span>{% elif change > 0 %}<span class="rank-up" title="Up {{ change }} place{{ change|pluralize }} from the MLAIB starting rank">&#9650;&#8239;{{ change }}</span>{% elif change < 0 %}<span class="rank-down" title="Down {{ change|cut:'-' }} place{{ change|cut:'-'|pluralize }} from the MLAIB starting rank">&#9660;&#8239;{{ change|cut:'-' }}</span>{% else %}<span class="muted" title="Same as the MLAIB starting rank">0</span>{% endif %}
