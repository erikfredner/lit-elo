[project]
name = "lit-elo"
version = "0.1.0"
description = "Canon Wars: ranks American literary authors and works by canonicity via LLM-judged ELO matchups"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.3",
    "django-extensions>=4.1",
    "openai>=1.107.3",
    "pydantic>=2.11.9",
    "python-dotenv>=1.1.1",
    "whitenoise>=6.9.0",
]

[dependency-groups]
dev = [
    "ghp-import>=2.1.0",
    "pytest>=9.0.3",
    "pytest-django>=4.14.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
